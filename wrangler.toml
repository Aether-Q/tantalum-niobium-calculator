name = "t004-ta-calculator"
main = "src/worker.js"
compatibility_date = "2026-10-12"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "MARKET"
# Replace with your own Cloudflare KV namespace ID before deploying.
id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["0 4 * * *", "0 5 * * *"]
